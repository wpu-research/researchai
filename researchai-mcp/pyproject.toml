[project]
name = "researchai-mcp"
version = "0.1.0"
description = "Kaynak arama, atıf doğrulama ve YZ kullanım beyanı için MCP sunucusu"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
researchai-mcp = "researchai_mcp.server:main"
researchai-harvest = "researchai_mcp.harvest:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
